version: 2

builds:
  - id: yi
    main: ./cmd/yi
    binary: yi
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - ids:
      - yi
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  header: |
    `yi` syncs an Obsidian Kanban board (`Kanban.md`) and task notes with GitHub Issues: status lives in
    `status:*` labels or in a GitHub Project's Status field (`github.project`). See the README for setup.

    **Known limitations**
    - GitHub is the only provider so far.
    - Don't edit the board in Obsidian while `yi pull`/`yi push` runs: yi then refuses to overwrite `Kanban.md`.
